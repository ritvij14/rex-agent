name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install locked development tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install pinned secret scanner
        run: npm run setup
      - name: Run no-emit typecheck, tests, privacy checks, and formatting
        run: npm run check
      - name: Verify sandbox isolation with a synthetic model endpoint
        run: npm run sandbox -- check
      - name: Check all fetched commit history before release
        run: npm run release:check
